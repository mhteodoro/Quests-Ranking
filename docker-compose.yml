services:
  postgres:
    image: postgres:17-alpine
    container_name: missions-ranking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: missions_ranking
    ports:
      - "5433:5432"
    volumes:
      - missions-ranking-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d missions_ranking" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  missions-ranking-data:
